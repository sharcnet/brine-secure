#cloud-config
ssh_authorized_keys:
  - ${ssh_public_key}
users:
  - default
  - name: agent
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/hosts
    append: true
    content: "${brine_ip} brine.sharcnet.ca\n"
  - path: /etc/profile.d/pi.sh
    content: |
      export PI_OFFLINE=1
      export PATH=/opt/node/bin:$PATH
  - path: /usr/local/bin/pi-brine-setup.mjs
    permissions: "0755"
    content: |
      #!/opt/node/bin/node
      import { readFileSync, mkdirSync, writeFileSync } from "node:fs";
      import { homedir } from "node:os";
      const key = readFileSync(0, "utf8").trim();
      const baseUrl = "https://brine.sharcnet.ca/v1";
      const res = await fetch(baseUrl + "/models", { headers: { Authorization: "Bearer " + key } });
      if (!res.ok) { console.error("Brine answered " + res.status); process.exit(1); }
      const chatModels = (await res.json()).data.map((m) => m.id).filter((id) => !/embed|whisper/i.test(id));
      const preferred = "North-Mini-Code-1.0";
      const dir = homedir() + "/.pi/agent";
      mkdirSync(dir, { recursive: true, mode: 0o700 });
      const provider = { baseUrl, api: "openai-completions", apiKey: key, models: chatModels.map((id) => ({ id })) };
      writeFileSync(dir + "/models.json", JSON.stringify({ providers: { brine: provider } }, null, 2), { mode: 0o600 });
      const defaultModel = chatModels.includes(preferred) ? preferred : chatModels[0];
      writeFileSync(dir + "/settings.json", JSON.stringify({ defaultProvider: "brine", defaultModel }, null, 2));
      console.log("Brine models: " + chatModels.join(", "));

runcmd:
  - mkdir -p /opt/node /data /home/agent/work
  - curl -fsSL https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.xz | tar -xJ -C /opt/node --strip-components=1
  - PATH=/opt/node/bin:$PATH npm install -g @mariozechner/pi-coding-agent@0.73.1
  - chown agent:agent /home/agent/work
