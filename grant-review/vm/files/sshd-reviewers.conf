# /etc/ssh/sshd_config.d/50-reviewers.conf
# Reviewers use the web page only (decision 2026-11-18). sshd refuses the reviewers group
# before authentication; pam_access and the security group (SSH from admin addresses only)
# refuse them too.
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
PermitUserEnvironment no
DenyGroups reviewers
