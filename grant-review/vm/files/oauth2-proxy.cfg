# /etc/brine-review/sso/oauth2-proxy.cfg (WEB_AUTH=sso). The provider, headers and listen
# address are in oauth2-proxy.yaml next to this file. No secrets here: the client secret and
# cookie secret are files readable by the oauth2-proxy user only.
redirect_url        = "https://@SSO_HOST@/oauth2/callback"
cookie_secret_file  = "/etc/brine-review/sso/cookie-secret"
cookie_name         = "__Host-review_sso"
cookie_secure       = true
cookie_samesite     = "lax"
cookie_expire       = "12h"
cookie_refresh      = "0"
cookie_csrf_per_request = true
cookie_csrf_expire  = "15m"
reverse_proxy       = true
trusted_proxy_ips   = ["127.0.0.1"]
skip_provider_button = true
# The active reviewers, as <ccdb-username>@alliancecan.ca. Rewritten by web-access-sync;
# oauth2-proxy watches it, so removing someone ends their session on the next request.
authenticated_emails_file = "/etc/brine-review/web/active-emails"
# Request logs would hold URLs, and URLs carry application names: off (nginx logs metadata).
request_logging     = false
silence_ping_logging = true
banner              = "Grant review"
footer              = "-"
