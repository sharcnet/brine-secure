# /etc/ssh/sshd_config.d/60-certpush.conf  (configure writes it only when CERT_PUSH_KEY is set)
# The certificate pusher (e.g. the Ansible host) gets one thing: install-web-cert, reading a
# tar of tls.crt and tls.key on stdin. Its key lives in a root-owned file with from= and
# restrict, sudo allows that one command with no arguments, and pam_access and the security
# group admit it only from CERT_PUSH_CIDRS.
Match User certpush
    AuthorizedKeysFile /etc/ssh/certpush_authorized_keys
    AuthenticationMethods publickey
    ForceCommand sudo -n /usr/local/sbin/install-web-cert
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitListen none
    PermitOpen none
