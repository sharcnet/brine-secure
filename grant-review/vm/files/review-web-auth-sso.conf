# /etc/nginx/review-web-auth.conf for WEB_AUTH=sso (included inside the server block).
# Sign-in: CILogon with the Alliance IdP and MFA, through oauth2-proxy (127.0.0.1:4180).
# Every reviewer request is first checked by review-authz (127.0.0.1:4181), which answers
# with the reviewer's name only if the IdP, MFA, eppn and active list all check out.
set $web_auth sso;

# Sign-in, callback and sign-out pages.
location /oauth2/ {
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Authorization     "";
    error_page 502 503 504 = @unavailable;
}
# Only review-authz asks oauth2-proxy this, on loopback; its answer carries the ID token.
location = /oauth2/auth {
    return 404;
}

location = /_authz {
    internal;
    proxy_pass http://127.0.0.1:4181;
    proxy_pass_request_body off;
    proxy_set_header Content-Length    "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Authorization     "";
}

location / {
    auth_request     /_authz;
    auth_request_set $sso_user $upstream_http_x_review_user;
    error_page 401 = @signin;
    error_page 403 = @denied;
    error_page 500 = @unavailable;
    include snippets/review-web-proxy.conf;
}

# Not signed in: pages go to the sign-in; the page's own API calls get a 401 (it reloads).
location @signin {
    if ($request_uri ~ "^/api/") {
        return 401;
    }
    return 302 /oauth2/start?rd=$request_uri;
}

# Signed in but refused (not an active reviewer, no MFA, another IdP...). Same 403, with a
# page that says so; review-authz's journal has the reason. The app's API calls get the code.
location @denied {
    if ($request_uri ~ "^/api/") {
        return 403;
    }
    default_type text/html;
    return 403 '<!doctype html><meta charset="utf-8"><title>No access</title><body style="font:16px system-ui,sans-serif;max-width:36em;margin:4em auto;padding:0 1em"><h1>No access</h1><p>You are signed in, but this account is not an active reviewer on this site.</p><p>If you expected access, contact the competition administrators. They activate each reviewer after a second person checks their assignments.</p><p><a href="/oauth2/sign_out">Sign out</a></p>';
}

# The sign-in service is down (e.g. no client secret yet). Still refused: never fails open.
location @unavailable {
    if ($request_uri ~ "^/api/") {
        return 503;
    }
    default_type text/html;
    return 503 '<!doctype html><meta charset="utf-8"><title>Sign-in unavailable</title><body style="font:16px system-ui,sans-serif;max-width:36em;margin:4em auto;padding:0 1em"><h1>Sign-in is unavailable</h1><p>The sign-in service is not running right now. Please try again later.</p>';
}
