# /etc/nginx/snippets/brine-proxy.conf. configure fills in @BRINE_HOST@.
# Upstream: brine (LiteLLM). Host and SNI are always brine's name, so this proxy can only
# ever reach brine's own virtual host, never another site on the same IP.
proxy_pass https://@BRINE_HOST@;
proxy_http_version 1.1;
# Send none of the client's headers; set exactly the ones brine needs.
# [VERIFY] with test 25 that request bodies and streaming still work this way.
proxy_pass_request_headers off;
proxy_set_header Host @BRINE_HOST@;
proxy_set_header Connection "";
proxy_set_header Content-Type $content_type;
proxy_set_header Accept $http_accept;
proxy_ssl_server_name on;
proxy_ssl_name @BRINE_HOST@;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
# Streaming (SSE). Buffering off also keeps request and response bodies out of nginx's temp
# files on the (unencrypted) root disk.
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 900s;
proxy_send_timeout 900s;
