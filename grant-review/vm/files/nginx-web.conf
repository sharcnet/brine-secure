# /etc/nginx/conf.d/review-web.conf: the HTTPS front door for reviewers' web app.
#
# Sign-in is HTTP basic auth against /etc/brine-review/web/htpasswd (one line per reviewer,
# set with web-password). For production, replace auth_basic with SSO (e.g. oauth2-proxy and
# the institution's identity provider via auth_request) and map the signed-in identity to the
# reviewer name in $review_sock's map. Everything below that line stays the same.

# No URLs in the log: paths carry application file names, and who reviews what is confidential.
log_format review_web '$time_iso8601 $remote_user $request_method $status $body_bytes_sent $request_time';

# The signed-in reviewer's own socket. Used only when proxying, which happens after auth_basic
# has checked the password (an `if` here would run before auth and skip the sign-in prompt).
# Anything that isn't a plain reviewer name maps to a path that can't exist ("-" can't start
# a username), so it fails closed.
map $remote_user $review_sock {
    "~^(?<rv>[a-z][a-z0-9_-]{0,30})$"  /run/review-web/$rv/web.sock;
    default                            /run/review-web/-/web.sock;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/brine-review/web/tls.crt;
    ssl_certificate_key /etc/brine-review/web/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/review-web.access.log review_web;

    auth_basic           "Grant review";
    auth_basic_user_file /etc/brine-review/web/htpasswd;

    # Bodies stay in memory, never in nginx temp files on the root disk.
    client_max_body_size    1m;
    client_body_buffer_size 1m;
    proxy_request_buffering off;
    proxy_buffering         off;

    location / {
        # Each signed-in reviewer reaches only their own container's socket.
        proxy_pass http://unix:$review_sock:$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host            "review";
        proxy_set_header Connection      "";
        proxy_set_header Authorization   "";      # the password never reaches the container
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 3600s;                 # assistant answers stream for a while
        proxy_send_timeout 3600s;
    }
}
