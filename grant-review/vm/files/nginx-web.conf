# /etc/nginx/conf.d/review-web.conf: the HTTPS front door for reviewers' web app.
#
# Sign-in is in /etc/nginx/review-web-auth.conf, which configure installs for WEB_AUTH:
#   sso    CILogon (Alliance account + MFA) via oauth2-proxy and review-authz. For reviewers.
#   basic  HTTP basic auth against /etc/brine-review/web/htpasswd (web-password). For the
#          local test VM, and acceptance tests before SSO is switched on.
# Either way the auth file sets $web_auth, and the signed-in name must be on the active list
# (/etc/brine-review/web/active.map, written by web-access-sync) before a socket is chosen.

# No URLs in the log: paths carry application file names, and who reviews what is confidential.
log_format review_web '$time_iso8601 $review_user $request_method $status $body_bytes_sent $request_time';

# The signed-in name: basic auth's user, or the name review-authz returned after its checks.
map $web_auth $review_name {
    basic    $remote_user;
    sso      $sso_user;
    default  "";
}

# Only active reviewers. A pending or removed reviewer maps to "", which no socket matches.
map $review_name $review_user {
    include  /etc/brine-review/web/active.map;
    default  "";
}

# The signed-in reviewer's own socket. Used only when proxying, which happens after sign-in
# (an `if` here would run before auth). Anything that isn't a plain reviewer name maps to a
# path that can't exist ("-" can't start a username), so it fails closed.
map $review_user $review_sock {
    "~^(?<rv>[a-z][a-z0-9_-]{0,30})$"  /run/review-web/$rv/web.sock;
    default                            /run/review-web/-/web.sock;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/brine-review/web/tls.crt;
    ssl_certificate_key /etc/brine-review/web/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/review-web.access.log review_web;

    # Bodies stay in memory, never in nginx temp files on the root disk.
    client_max_body_size    1m;
    client_body_buffer_size 1m;
    proxy_request_buffering off;
    proxy_buffering         off;

    include /etc/nginx/review-web-auth.conf;
}
