# /etc/nginx/snippets/review-web-proxy.conf: the hop to the signed-in reviewer's container.
proxy_pass http://unix:$review_sock:$request_uri;
proxy_http_version 1.1;
proxy_set_header Host            "review";
proxy_set_header Connection      "";
proxy_set_header Authorization   "";      # the password never reaches the container
proxy_set_header Cookie          "";      # nor the sign-in session
proxy_set_header X-Forwarded-For "";
proxy_read_timeout 3600s;                 # assistant answers stream for a while
proxy_send_timeout 3600s;
