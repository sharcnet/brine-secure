# /etc/ssh/sshd_config.d/55-root.conf  (configure writes it only when ROOT_SSH_KEYS is set)
# Root by SSH key, only from ROOT_SSH_CIDRS (decision 2026-11-23: named admins, for the web
# certificate and break-glass). 50-reviewers.conf keeps PermitRootLogin no everywhere else.
# The keys carry from= too, and pam_access and the security group admit only these addresses.
Match User root Address @ROOT_SSH_CIDRS@
    PermitRootLogin prohibit-password
    AuthenticationMethods publickey
    X11Forwarding no
    AllowAgentForwarding no
